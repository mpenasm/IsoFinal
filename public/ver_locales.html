<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Restaurantes - IsoDB</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 30px;
        }

        #localesGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .card-content {
            padding: 15px;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
        }

        .card p {
            margin: 0;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .no-data {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: #94a3b8;
        }

        .btn-volver {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🍽️ Restaurantes Guardados</h1>

    <div id="localesGrid">
        <!-- Los restaurantes se cargarán aquí -->
        <p class="no-data">Cargando restaurantes...</p>
    </div>

    <a href="index.html" class="btn-volver">Añadir Nuevo Restaurante</a>

    <script>
        const API_URL = 'http://localhost:4000/api/locales';
        const grid = document.getElementById('localesGrid');

        async function cargarLocales() {
            try {
                const res = await fetch(API_URL);
                const locales = await res.json();
                
                grid.innerHTML = '';
                
                if (locales.length === 0) {
                    grid.innerHTML = '<p class="no-data">No hay restaurantes guardados todavía.</p>';
                    return;
                }
                
                locales.forEach(local => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${local.fotoUrl}" alt="${local.nombre}" onerror="this.src='https://via.placeholder.com/400x200?text=Sin+Imagen'">
                        <div class="card-content">
                            <h3>${local.nombre}</h3>
                            <p>📍 ${local.localidad}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Error:", err);
                grid.innerHTML = '<p class="no-data">Error al conectar con la API.</p>';
            }
        }

        cargarLocales();
    </script>
</body>
</html>
